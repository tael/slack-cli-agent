name: tests

# PR 과 main push 에서 단위 시험을 돌린다.
# 실제 엔진 CLI 가 필요한 시험(tests/real_cli)과 프로세스를 죽이는 통합 시험
# (tests/integration)은 범위에서 뺀다. 로그인 상태와 요금에 의존하기 때문이다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치 (uv.lock 고정)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: 단위 시험
        run: uv run --no-sync python -m pytest -q tests/unit -p no:cacheprovider
